<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soltri Top100 품목별 적재 부피 시각화</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:#0f172a;color:#e2e8f0}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:28px 40px;border-bottom:1px solid #334155}
.header h1{font-size:26px;font-weight:700;color:#f8fafc}
.header p{color:#94a3b8;margin-top:4px;font-size:13px}
.container{max-width:1500px;margin:0 auto;padding:24px 32px}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.s-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px 20px}
.s-card.accent{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#1e293b)}
.s-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.8px}
.s-val{font-size:26px;font-weight:700;color:#f8fafc;margin-top:2px}
.s-sub{font-size:12px;color:#94a3b8;margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#94a3b8;background:0;border:1px solid transparent;transition:.2s}
.tab:hover{color:#e2e8f0;background:#1e293b}
.tab.active{color:#f8fafc;background:#334155;border-color:#475569}
.pane{display:none}.pane.active{display:block}

/* 3D Stack View */
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.stack-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:18px;transition:transform .15s;cursor:default}
.stack-card:hover{transform:translateY(-2px);border-color:#475569}
.sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sc-chisu{font-size:16px;font-weight:700}
.sc-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.sc-dims{font-size:12px;color:#94a3b8;margin-bottom:8px}
.sc-vol{font-size:22px;font-weight:700;margin-bottom:4px}
.sc-detail{font-size:11px;color:#64748b;line-height:1.6}

/* 3D box */
.box-scene{width:100%;height:100px;perspective:500px;margin:8px 0}
.box-wrap{width:100%;height:100%;position:relative;transform-style:preserve-3d;display:flex;align-items:flex-end;justify-content:center}
.box3d{position:relative;transform-style:preserve-3d;transform:rotateX(-15deg) rotateY(25deg)}
.bface{position:absolute;border:1.5px solid rgba(255,255,255,.25)}
.bf-front{transform:translateZ(calc(var(--d)/2))}
.bf-back{transform:translateZ(calc(var(--d)/-2))}
.bf-left{left:0;transform:rotateY(-90deg) translateZ(calc(var(--w)/2))}
.bf-right{right:0;transform:rotateY(90deg) translateZ(calc(var(--w)/2))}
.bf-top{top:0;transform:rotateX(90deg) translateZ(calc(var(--h)/2))}

/* Bar Chart */
.chart-area{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:24px;overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:2px;height:320px;min-width:max-content;padding-bottom:60px;position:relative}
.bar-col{display:flex;flex-direction:column;align-items:center;width:14px;position:relative}
.bar-rect{width:100%;border-radius:2px 2px 0 0;cursor:pointer;position:relative;transition:opacity .15s}
.bar-rect:hover{opacity:.75}
.bar-lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%) rotate(-55deg);transform-origin:top left;font-size:9px;color:#64748b;white-space:nowrap;margin-top:6px}
.bar-tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #475569;border-radius:8px;padding:10px 14px;white-space:nowrap;z-index:100;font-size:12px;line-height:1.5;pointer-events:none}
.bar-rect:hover .bar-tip{display:block}

/* Bubble */
.bubble-area{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:24px;position:relative;min-height:500px}
.bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform .15s;border:2px solid rgba(255,255,255,.2)}
.bubble:hover{transform:scale(1.12);z-index:20}
.bubble .b-tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #475569;border-radius:8px;padding:10px 14px;white-space:nowrap;z-index:100;font-size:12px;line-height:1.5;pointer-events:none}
.bubble:hover .b-tip{display:block}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid #334155}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#1e293b;color:#94a3b8;font-weight:600;padding:10px 12px;text-align:left;position:sticky;top:0;border-bottom:2px solid #334155;cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:#e2e8f0}
tbody td{padding:8px 12px;border-bottom:1px solid #1e293b;white-space:nowrap}
tbody tr{background:#0f172a}tbody tr:nth-child(even){background:#131c2e}tbody tr:hover{background:#1e293b}
.jb{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.lg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#94a3b8}
.lg-dot{width:10px;height:10px;border-radius:3px}

/* Filter */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters select,.filters input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 12px;border-radius:6px;font-size:13px}

@media(max-width:768px){.container{padding:16px}.stack-grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function sw(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+name).classList.add('active');
  event.target.classList.add('active');
}

function filterCards(){
  const j=document.getElementById('fJaejil').value;
  const s=document.getElementById('fSort').value;
  const grid=document.getElementById('cardGrid');
  const cards=[...grid.children];
  cards.forEach(c=>{
    const show=!j||c.dataset.j===j;
    c.style.display=show?'':'none';
  });
  const key={vol:'vol',freq:'freq',stock:'stock',chisu:'chisu'}[s];
  cards.sort((a,b)=>{
    if(key==='chisu')return a.dataset.chisu.localeCompare(b.dataset.chisu);
    return parseFloat(b.dataset[key])-parseFloat(a.dataset[key]);
  });
  cards.forEach(c=>grid.appendChild(c));
}

let sc=-1,sa=true;
function st(col){
  const tb=document.querySelector('#tbl tbody');
  const rows=[...tb.querySelectorAll('tr')];
  if(sc===col)sa=!sa;else{sc=col;sa=col<=2}
  rows.sort((a,b)=>{
    let av=a.cells[col].textContent,bv=b.cells[col].textContent;
    if(col===1||col===2||col===5)return sa?av.localeCompare(bv):bv.localeCompare(av);
    av=parseFloat(av.replace(/[^0-9.\-]/g,''));bv=parseFloat(bv.replace(/[^0-9.\-]/g,''));
    return sa?av-bv:bv-av;
  });
  rows.forEach(r=>tb.appendChild(r));
}

render();
</script>
</body>
