  .card-sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }

  .box-card.small::before { background: #22c55e; }
  .box-card.medium::before { background: #f59e0b; }
  .box-card.large::before { background: #ef4444; }
  .box-card.xlarge::before { background: #8b5cf6; }

  .box-3d { width: 120px; height: 100px; margin: 16px auto; position: relative; perspective: 400px; }
  .box-3d .face { position: absolute; border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }

  .box-3d .side { width: 30px; height: 60px; bottom: 0; right: 10px; transform: skewY(10deg); }
  .box-3d .top { width: 80px; height: 25px; top: 10px; left: 20px; transform: skewX(-20deg) skewY(-5deg); }

  .box-info .name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .box-info .dims { font-size: 13px; color: #94a3b8; }
  .box-info .vol { font-size: 14px; color: #64748b; margin-top: 2px; }

  .fill-pct { font-size: 12px; color: #94a3b8; margin-top: 4px; text-align: right; }

  /* Chart */
  .chart-container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 200px; padding-top: 20px; }
  .bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .bar { width: 100%; min-height: 2px; border-radius: 3px 3px 0 0; position: relative; cursor: pointer; transition: opacity 0.2s; }

  .bar-label { font-size: 8px; color: #64748b; margin-top: 4px; writing-mode: vertical-rl; text-orientation: mixed; max-height: 60px; overflow: hidden; }

const JAEJIL_COLORS = {

  'M/T': '#84cc16', 'M/N': '#a3e635'
};

function getColor(jaejil) { return JAEJIL_COLORS[jaejil] || '#64748b'; }

function fmt(n) { return n.toLocaleString('ko-KR'); }
function fmtVol(cm3) {
  if (cm3 >= 1000) return (cm3/1000).toFixed(1) + 'L';
  return cm3.toFixed(0) + 'cm³';
}

// Box categories
function categorizeForBox(item) {
  const s = item.box_side;
  if (s <= 60) return 'small';
  if (s <= 120) return 'medium';
  if (s <= 180) return 'large';
  return 'xlarge';
}

const categories = {
  small:  { name: '소형 박스', dims: '30×30×30cm', vol: 27, color: '#22c55e', items: [] },
  medium: { name: '중형 박스', dims: '40×40×30cm', vol: 48, color: '#f59e0b', items: [] },
  large:  { name: '대형 박스', dims: '50×50×40cm', vol: 100, color: '#ef4444', items: [] },
  xlarge: { name: '특대 박스', dims: '60×60×50cm', vol: 180, color: '#8b5cf6', items: [] }
};

DATA.forEach(item => {
  const cat = categorizeForBox(item);
  categories[cat].items.push(item);
});

// Calculate how many pieces fit in each box
function pcsPerBox(item, boxVolL) {
  const boxVolCm3 = boxVolL * 1000;
  const packing = 0.65; // packing efficiency for ring shapes
  return Math.floor((boxVolCm3 * packing) / item.vol_per_piece_cm3);
}

        <div class="tooltip">
          <div><strong>${item.chisu}</strong> (${item.jaejil})</div>
          <div>빈도: ${item.freq}회</div>
          <div>평균수량: ${item.avg_qty}개</div>
          <div>개당: ${item.vol_per_piece_cm3}cm³</div>
          <div>총부피: ${fmtVol(item.total_vol_cm3)}</div>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  html += `<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#64748b;">
    <span>← 고빈도 (${DATA[0].freq}회)</span><span>저빈도 (${DATA[DATA.length-1].freq}회) →</span>
  </div>`;
  html += `</div></div></div>`;

  // === Tab: Table ===
  html += `<div class="tab-content" id="tab-table">`;
  html += `<div class="section"><div class="section-title">전체 데이터 테이블 <span class="badge">클릭하여 정렬</span></div>`;
  html += `<div class="table-wrap"><table id="dataTable">
    <thead><tr>
      <th onclick="sortTable(0)">순위</th>
      <th onclick="sortTable(1)">치수(외경×폭×높이)</th>
      <th onclick="sortTable(2)">재질</th>
      <th onclick="sortTable(3)">빈도</th>
      <th onclick="sortTable(4)">평균수량</th>
      <th onclick="sortTable(5)">개당부피</th>
      <th onclick="sortTable(6)">총부피(1회)</th>
      <th onclick="sortTable(7)">사이즈</th>
      <th onclick="sortTable(8)">재고</th>
      <th onclick="sortTable(9)">추천박스</th>
    </tr></thead><tbody>`;

  DATA.forEach((item, idx) => {
    const cat = categorizeForBox(item);
    const sizeLabel = {small:'소형', medium:'중형', large:'대형', xlarge:'특대'}[cat];
    const sizeClass = {small:'size-s', medium:'size-m', large:'size-l', xlarge:'size-l'}[cat];
    const boxInfo = categories[cat];
    const pcs = pcsPerBox(item, boxInfo.vol);
    const color = getColor(item.jaejil);

    html += `<tr>
      <td>${item.rank}</td>
      <td><strong>${item.chisu}</strong></td>
      <td><span class="jaejil-badge" style="background:${color}22;color:${color}">${item.jaejil}</span></td>
      <td>${item.freq}회</td>
      <td>${item.avg_qty}개</td>
      <td>${item.vol_per_piece_cm3}cm³</td>
      <td><strong>${fmtVol(item.total_vol_cm3)}</strong></td>
      <td><span class="size-badge ${sizeClass}">${sizeLabel}</span></td>
      <td>${item.stock}개</td>
      <td>${boxInfo.name} (${pcs}개/박스)</td>
    </tr>`;
  });

  html += `</tbody></table></div></div></div>`;

  app.innerHTML = html;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

let sortCol = -1, sortAsc = true;
function sortTable(col) {
  const table = document.getElementById('dataTable');
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));

  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }

  rows.sort((a, b) => {
    let av = a.cells[col].textContent.replace(/[^0-9.\-]/g, '');
    let bv = b.cells[col].textContent.replace(/[^0-9.\-]/g, '');
    if (col === 1 || col === 2) { av = a.cells[col].textContent; bv = b.cells[col].textContent; return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av); }
    return sortAsc ? parseFloat(av) - parseFloat(bv) : parseFloat(bv) - parseFloat(av);
  });

  rows.forEach(r => tbody.appendChild(r));
}

render();
</script>

</body>
